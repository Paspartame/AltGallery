[github]
repo = "swipt-automation/swipt"
[source]
name = "XHN.EE"
subtitle = "Zelda's Personal Source"
description = "A curated personal source of official GitHub release builds for LiveContainer, SideStore, and AltStore. Checked for updates every 6 hours."
icon_url = "https://raw.githubusercontent.com/Paspartame/AltGallery/master/assets/icon.png"
website = "https://ipa.xhn.ee"
tint_color = "#5B7CFA"
[app]
name = "Swipt Nightly"
bundle_identifier = "io.nekohasekai.swipt"
developer_name = "nekohasekai"
subtitle = "iPhone automation · nightly builds"
description = "Automate your iPhone or iPad with JavaScript swiplets. Tracks official nightly builds; version and build numbers come from the official altstore.json, and newer builds refresh even when the version is unchanged. Source compatibility does not guarantee every feature works in LiveContainer; use SideStore for pairing, background, or automation limitations."
icon_url = "https://raw.githubusercontent.com/Paspartame/AltGallery/master/apps/Swipt/icon.png"
tint_color = "#725AF8"
min_os_version = "16.4"
[versions]
strip_v_prefix = false
include_prereleases = true
asset_pattern = "^Swipt\\.ipa$"
version_pattern = "^nightly$"
version_source = "release"
max_versions = 1
[news]
image_url = "https://raw.githubusercontent.com/Paspartame/AltGallery/master/apps/Swipt/images/news.png"
[output]
path = "apps.json"
