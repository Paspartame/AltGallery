[github]
repo = "WXRIW/Lyricify-App"
[source]
name = "XHN.EE"
subtitle = "Zelda's Personal Source"
description = "A curated personal source of official GitHub release builds for LiveContainer, SideStore, and AltStore. Checked for updates every 6 hours."
icon_url = "https://raw.githubusercontent.com/Paspartame/AltGallery/master/assets/icon.png"
website = "https://ipa.xhn.ee"
tint_color = "#5B7CFA"
[app]
name = "Lyricify Mobile"
bundle_identifier = "com.wxriw.LyricifyMobile"
developer_name = "WXRIW"
subtitle = "Lyrics for Spotify and Apple Music"
description = "Lyricify Mobile for iOS, with word-by-word lyrics and Apple Music and Spotify playback sources. Requires iOS 12.2; desktop lyrics require iOS 15 or later. Only stable mobile-v* iOS IPA releases are included."
icon_url = "https://raw.githubusercontent.com/Paspartame/AltGallery/master/apps/Lyricify-Mobile/icon.png"
tint_color = "#DF565D"
min_os_version = "12.2"
[versions]
strip_v_prefix = false
include_prereleases = true
asset_pattern = "^LyricifyMobile\\.v.*-release\\.ipa$"
version_pattern = "^mobile-v(\\d+\\.\\d+\\.\\d+)$"
version_source = "release"
max_versions = 1
[news]
image_url = "https://raw.githubusercontent.com/Paspartame/AltGallery/master/apps/Lyricify-Mobile/images/news.png"
[output]
path = "apps.json"
